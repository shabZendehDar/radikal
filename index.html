<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رادیکال — ریاضی نهم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ============================================
     🟤 پالت کهربایی-قهوه‌ای
     ============================================ */
  :root {
    --primary: #d97706;
    --primary-dark: #b45309;
    --primary-darker: #92400e;
    --primary-light: #fef3c7;
    --primary-lighter: #fffbeb;
    --accent: #f59e0b;

    --success: #10b981;
    --info: #3b82f6;
    --warning: #f59e0b;
    --danger: #ef4444;

    --bg: #fefaf3;
    --card: #ffffff;
    --text: #1c1917;
    --text-light: #78716c;
    --border: #fde68a;
    --shadow: rgba(217, 119, 6, 0.08);
    --shadow-lg: rgba(217, 119, 6, 0.15);

    --topbar-h: 65px;
    --sidebar-w: 260px;
  }

  body.dark {
    --bg: #1c1917;
    --card: #292524;
    --text: #fef3c7;
    --text-light: #a8a29e;
    --border: #44403c;
    --shadow: rgba(0, 0, 0, 0.4);
    --shadow-lg: rgba(0, 0, 0, 0.6);
    --primary-light: #78350f;
    --primary-lighter: #431407;
  }

  body {
    font-family: 'Vazirmatn', 'Tahoma', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    font-size: 15px;
    transition: background 0.3s, color 0.3s;
  }

  /* ============================================
     🔝 TOP BAR
     ============================================ */
  .topbar {
    position: fixed;
    top: 0; right: 0; left: 0;
    height: var(--topbar-h);
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 1000;
    box-shadow: 0 2px 15px var(--shadow);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .menu-btn {
    display: none;
    background: none;
    border: none;
    font-size: 1.5rem;
    color: var(--text);
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .menu-btn:hover { background: var(--primary-light); }

  .logo-box {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text);
  }

  .logo-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, #d97706, #92400e);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: white;
    box-shadow: 0 4px 15px rgba(217,119,6,0.3);
  }

  .logo-text {
    font-weight: 900;
    font-size: 1.15rem;
    color: var(--primary-dark);
    line-height: 1.2;
  }
  .logo-text small {
    display: block;
    font-size: 0.7rem;
    color: var(--text-light);
    font-weight: 400;
  }

  .topbar-center {
    flex: 1;
    max-width: 500px;
    margin: 0 30px;
  }

  .search-input {
    width: 100%;
    background: var(--primary-lighter);
    border: 2px solid transparent;
    padding: 10px 18px 10px 45px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text);
    outline: none;
    transition: all 0.2s;
  }
  .search-input:focus {
    border-color: var(--primary);
    background: var(--card);
    box-shadow: 0 0 0 4px var(--primary-light);
  }
  .search-wrapper {
    position: relative;
  }
  .search-wrapper::before {
    content: '🔍';
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.95rem;
    opacity: 0.6;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    background: transparent;
    border: none;
    width: 42px; height: 42px;
    border-radius: 12px;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
    color: var(--text);
  }
  .icon-btn:hover {
    background: var(--primary-light);
    transform: translateY(-2px);
  }

  .icon-btn .badge {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 8px; height: 8px;
    background: var(--danger);
    border-radius: 50%;
    border: 2px solid var(--card);
  }

  .user-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d97706, #92400e);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
    box-shadow: 0 4px 12px rgba(217,119,6,0.25);
    transition: transform 0.2s;
  }
  .user-avatar:hover { transform: scale(1.05); }

  /* ============================================
     📊 PROGRESS BAR
     ============================================ */
  .progress-bar {
    position: fixed;
    top: var(--topbar-h);
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #fbbf24, #d97706);
    width: 0%;
    z-index: 999;
    transition: width 0.2s;
  }

  /* ============================================
     📐 LAYOUT
     ============================================ */
  .layout {
    display: flex;
    padding-top: var(--topbar-h);
    min-height: 100vh;
  }

  /* ============================================
     📚 SIDEBAR
     ============================================ */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--card);
    border-left: 1px solid var(--border);
    position: fixed;
    top: var(--topbar-h);
    bottom: 0;
    right: 0;
    overflow-y: auto;
    padding: 20px 12px;
    transition: transform 0.3s;
    z-index: 998;
  }

  .sidebar::-webkit-scrollbar { width: 5px; }
  .sidebar::-webkit-scrollbar-thumb {
    background: var(--primary-light);
    border-radius: 3px;
  }

  .sidebar-section {
    margin-bottom: 8px;
  }

  .sidebar-label {
    padding: 12px 15px 8px;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 15px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    font-size: 0.92rem;
    font-weight: 500;
    transition: all 0.2s;
    cursor: pointer;
    margin-bottom: 3px;
  }

  .sidebar-link:hover {
    background: var(--primary-lighter);
    color: var(--primary-dark);
  }

  .sidebar-link.active {
    background: linear-gradient(135deg, #d97706, #b45309);
    color: white;
    box-shadow: 0 4px 15px rgba(217,119,6,0.25);
  }

  .sidebar-link .icon {
    font-size: 1.15rem;
    width: 24px;
    text-align: center;
    flex-shrink: 0;
  }

  .sidebar-link .count {
    margin-right: auto;
    font-size: 0.75rem;
    background: var(--primary-light);
    color: var(--primary-dark);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
  }
  .sidebar-link.active .count {
    background: rgba(255,255,255,0.25);
    color: white;
  }

  /* ============================================
     📄 MAIN CONTENT
     ============================================ */
  .main {
    flex: 1;
    margin-right: var(--sidebar-w);
    padding: 30px 35px 60px;
    max-width: calc(100% - var(--sidebar-w));
  }

  /* ============================================
     🏠 WELCOME PAGE
     ============================================ */
  .hero {
    background: linear-gradient(135deg, #d97706, #92400e);
    color: white;
    border-radius: 20px;
    padding: 45px 40px;
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -80px; left: -80px;
    width: 250px; height: 250px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -100px; right: -50px;
    width: 300px; height: 300px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }

  .hero-content {
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 0.8rem;
    margin-bottom: 15px;
    font-weight: 600;
  }

  .hero h1 {
    font-size: 2.2rem;
    margin-bottom: 12px;
    font-weight: 900;
  }

  .hero p {
    font-size: 1.05rem;
    opacity: 0.95;
    max-width: 600px;
  }

  /* ============================================
     📊 STATS CARDS
     ============================================ */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
    margin-bottom: 30px;
  }

  .stat-card {
    background: var(--card);
    border-radius: 16px;
    padding: 22px;
    border: 2px solid var(--border);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .stat-card:hover {
    transform: translateY(-4px);
    border-color: var(--primary);
    box-shadow: 0 10px 25px var(--shadow);
  }

  .stat-icon {
    width: 50px; height: 50px;
    border-radius: 12px;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
  }

  .stat-info .value {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--primary-dark);
    line-height: 1.2;
  }

  .stat-info .label {
    font-size: 0.85rem;
    color: var(--text-light);
    font-weight: 500;
  }

  /* ============================================
     📚 CHAPTER CARDS
     ============================================ */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .section-header h2 {
    font-size: 1.3rem;
    color: var(--text);
    font-weight: 800;
  }

  .view-all {
    color: var(--primary);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .chapters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .chapter-card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    border: 2px solid var(--border);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chapter-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px var(--shadow-lg);
    border-color: var(--primary);
  }

  .chapter-num {
    width: 50px; height: 50px;
    background: linear-gradient(135deg, #d97706, #92400e);
    color: white;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 900;
    box-shadow: 0 6px 15px rgba(217,119,6,0.25);
  }

  .chapter-card h3 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--primary-dark);
  }

  .chapter-card p {
    font-size: 0.85rem;
    color: var(--text-light);
    margin: 0;
  }

  .chapter-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 15px;
    border-top: 1px dashed var(--border);
    font-size: 0.8rem;
    color: var(--text-light);
  }

  .chapter-progress-mini {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mini-bar {
    width: 60px;
    height: 5px;
    background: var(--primary-light);
    border-radius: 3px;
    overflow: hidden;
  }
  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #fbbf24, #d97706);
    border-radius: 3px;
  }

  /* ============================================
     📱 RESPONSIVE
     ============================================ */
  @media (max-width: 900px) {
    .menu-btn { display: flex; }
    .sidebar {
      transform: translateX(100%);
      box-shadow: -5px 0 30px rgba(0,0,0,0.2);
    }
    .sidebar.open { transform: translateX(0); }
    .main {
      margin-right: 0;
      max-width: 100%;
      padding: 20px 15px;
    }
    .topbar-center { display: none; }
    .hero { padding: 30px 25px; }
    .hero h1 { font-size: 1.5rem; }
    .chapters-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 500px) {
    .logo-text { display: none; }
    .topbar { padding: 0 12px; }
  }

  /* ============================================
     🌫️ OVERLAY
     ============================================ */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 997;
    backdrop-filter: blur(2px);
  }
  .overlay.active { display: block; }
</style>
</head>
<body>

<!-- ============================================
     🔝 TOP BAR
     ============================================ -->
<div class="topbar">
  <div class="topbar-right">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <a href="#home" class="logo-box">
      <div class="logo-icon">📐</div>
      <div class="logo-text">
        رادیکال
        <small>ریاضی نهم</small>
      </div>
    </a>
  </div>

  <div class="topbar-center">
    <div class="search-wrapper">
      <input type="text" class="search-input" placeholder="جستجو در درس‌ها، فرمول‌ها، تمرین‌ها...">
    </div>
  </div>

  <div class="topbar-left">
    <button class="icon-btn" title="علاقه‌مندی‌ها">⭐</button>
    <button class="icon-btn" title="اعلان‌ها">
      🔔
      <span class="badge"></span>
    </button>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="حالت شب/روز">🌙</button>
    <div class="user-avatar" title="حساب کاربری">ر</div>
  </div>
</div>

<!-- ============================================
     📊 PROGRESS BAR
     ============================================ -->
<div class="progress-bar" id="progressBar"></div>

<!-- ============================================
     🌫️ OVERLAY (Mobile)
     ============================================ -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- ============================================
     📐 LAYOUT
     ============================================ -->
<div class="layout">

  <!-- ============================================
       📚 SIDEBAR
       ============================================ -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-label">اصلی</div>
      <a href="#home" class="sidebar-link active">
        <span class="icon">🏠</span>
        <span>خانه</span>
      </a>
      <a href="#lessons" class="sidebar-link">
        <span class="icon">📚</span>
        <span>درسنامه</span>
        <span class="count">۲۴</span>
      </a>
      <a href="#practice" class="sidebar-link">
        <span class="icon">📝</span>
        <span>تمرین‌ها</span>
        <span class="count">۱۸۰</span>
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">آموزشی</div>
      <a href="#exams" class="sidebar-link">
        <span class="icon">🎯</span>
        <span>آزمون‌ها</span>
      </a>
      <a href="#analysis" class="sidebar-link">
        <span class="icon">📊</span>
        <span>آنالیز و پیشرفت</span>
      </a>
      <a href="#formulas" class="sidebar-link">
        <span class="icon">📖</span>
        <span>فرمول‌نامه</span>
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">ابزارها</div>
      <a href="#calculator" class="sidebar-link">
        <span class="icon">🧮</span>
        <span>ماشین‌حساب</span>
      </a>
      <a href="#favorites" class="sidebar-link">
        <span class="icon">⭐</span>
        <span>علاقه‌مندی‌ها</span>
      </a>
      <a href="#settings" class="sidebar-link">
        <span class="icon">⚙️</span>
        <span>تنظیمات</span>
      </a>
    </div>

  </aside>

  <!-- ============================================
       📄 MAIN CONTENT
       ============================================ -->
  <main class="main" id="mainContent">
    <!-- محتوای صفحه توسط JS لود می‌شود -->
  </main>

</div>

<script>
/* ============================================
   📚 محتوای صفحه اصلی (Home)
   ============================================ */
const HOME_CONTENT = `
  <div class="hero">
    <div class="hero-content">
      <div class="hero-badge">🎓 مسیر المپیاد فیزیک</div>
      <h1>سلام! خوش اومدی 👋</h1>
      <p>اینجا قراره ریاضی نهم رو عمیق یاد بگیری، سریع‌تر از مدرسه جلو بری و برای المپیاد فیزیک آماده بشی.</p>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">📚</div>
      <div class="stat-info">
        <div class="value">۸</div>
        <div class="label">فصل آموزشی</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">✏️</div>
      <div class="stat-info">
        <div class="value">۱۸۰</div>
        <div class="label">تمرین</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🎯</div>
      <div class="stat-info">
        <div class="value">۲۴</div>
        <div class="label">آزمون</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔥</div>
      <div class="stat-info">
        <div class="value">۵</div>
        <div class="label">روز پیوسته</div>
      </div>
    </div>
  </div>

  <div class="section-header">
    <h2>📖 فصل‌های آموزشی</h2>
    <a href="#lessons" class="view-all">مشاهده همه →</a>
  </div>

  <div class="chapters-grid">
    ${[
      {n: '۱', t: 'مجموعه‌ها', c: 4, p: 100},
      {n: '۲', t: 'عددهای حقیقی', c: 3, p: 60},
      {n: '۳', t: 'استدلال و اثبات', c: 5, p: 20},
      {n: '۴', t: 'توان و ریشه', c: 4, p: 0},
      {n: '۵', t: 'عبارت‌های جبری', c: 3, p: 0},
      {n: '۶', t: 'خط و معادله‌ها', c: 3, p: 0},
      {n: '۷', t: 'عبارت‌های گویا', c: 3, p: 0},
      {n: '۸', t: 'حجم و مساحت', c: 3, p: 0}
    ].map(ch => `
      <a href="#ch${ch.n}" class="chapter-card">
        <div class="chapter-num">${ch.n}</div>
        <h3>فصل ${ch.n}: ${ch.t}</h3>
        <p>${ch.c} درس آموزشی</p>
        <div class="chapter-meta">
          <div class="chapter-progress-mini">
            <div class="mini-bar">
              <div class="mini-bar-fill" style="width:${ch.p}%"></div>
            </div>
            <span>${ch.p}٪</span>
          </div>
          <span>${ch.p === 0 ? '🆕' : ch.p === 100 ? '✅' : '📖'}</span>
        </div>
      </a>
    `).join('')}
  </div>
`;

/* ============================================
   🔄 ROUTER — تغییر صفحه‌ها
   ============================================ */
function render() {
  const hash = location.hash.slice(1) || 'home';
  const main = document.getElementById('mainContent');

  // فعلاً فقط صفحه خانه رو نشون بده
  if (hash === 'home' || hash === '') {
    main.innerHTML = HOME_CONTENT;
  } else {
    main.innerHTML = `
      <div class="hero">
        <div class="hero-content">
          <div class="hero-badge">🚧 در حال ساخت</div>
          <h1>به‌زودی...</h1>
          <p>این بخش هنوز آماده نشده. به‌زودی محتوای آن اضافه می‌شود.</p>
        </div>
      </div>
    `;
  }

  // فعال کردن لینک sidebar
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  const activeLink = document.querySelector(`.sidebar-link[href="#${hash}"]`);
  if (activeLink) activeLink.classList.add('active');

  // بستن سایدبار موبایل
  closeSidebar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================
   🌙 تغییر تم
   ============================================ */
function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  document.getElementById('themeBtn').textContent = '☀️';
}

/* ============================================
   📱 سایدبار موبایل
   ============================================ */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('active');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}

/* ============================================
   📊 نوار پیشرفت اسکرول
   ============================================ */
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progressBar').style.width = progress + '%';
});
