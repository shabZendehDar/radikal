<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رادیکال — ریاضی نهم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ============================================
     🟤 پالت کهربایی-قهوه‌ای
     ============================================ */
  :root {
    --primary: #d97706;
    --primary-dark: #b45309;
    --primary-darker: #92400e;
    --primary-light: #fef3c7;
    --primary-lighter: #fffbeb;
    --accent: #f59e0b;

    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;

    --bg: #fefaf3;
    --card: #ffffff;
    --text: #1c1917;
    --text-light: #78716c;
    --border: #fde68a;
    --shadow: rgba(217, 119, 6, 0.08);
    --shadow-lg: rgba(217, 119, 6, 0.15);

    --topbar-h: 65px;
    --sidebar-w: 64px;
    --sidebar-w-open: 240px;
  }

  body.dark {
    --bg: #1c1917;
    --card: #292524;
    --text: #fef3c7;
    --text-light: #a8a29e;
    --border: #44403c;
    --shadow: rgba(0, 0, 0, 0.4);
    --shadow-lg: rgba(0, 0, 0, 0.6);
    --primary-light: #78350f;
    --primary-lighter: #431407;
  }

  body {
    font-family: 'Vazirmatn', 'Tahoma', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    font-size: 15px;
    transition: background 0.3s, color 0.3s;
  }

  /* ============================================
     🎨 آیکون SVG
     ============================================ */
  .icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  /* ============================================
     🔝 TOP BAR
     ============================================ */
  .topbar {
    position: fixed;
    top: 0; right: 0; left: 0;
    height: var(--topbar-h);
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 1000;
    box-shadow: 0 2px 15px var(--shadow);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .menu-btn {
    display: none;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
  }
  .menu-btn:hover { background: var(--primary-light); }

  /* ===== لوگو (فقط آیکون) ===== */
  .logo-box {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: var(--primary-dark);
    transition: all 0.3s;
  }

  .logo-box:hover {
    color: var(--primary);
    transform: scale(1.05);
  }

  .logo-svg {
    width: 48px;
    height: 48px;
    display: block;
  }

  .logo-svg path {
    fill: currentColor;
  }

  /* ===== جستجو ===== */
  .topbar-center {
    flex: 1;
    max-width: 500px;
    margin: 0 30px;
  }

  .search-wrapper {
    position: relative;
  }

  .search-wrapper .icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--text-light);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--primary-lighter);
    border: 2px solid transparent;
    padding: 10px 45px 10px 18px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text);
    outline: none;
    transition: all 0.2s;
  }
  .search-input:focus {
    border-color: var(--primary);
    background: var(--card);
    box-shadow: 0 0 0 4px var(--primary-light);
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    background: transparent;
    border: none;
    width: 42px; height: 42px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
    color: var(--text);
  }
  .icon-btn:hover {
    background: var(--primary-light);
    transform: translateY(-2px);
  }

  .icon-btn .badge {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px; height: 8px;
    background: var(--danger);
    border-radius: 50%;
    border: 2px solid var(--card);
  }

  .user-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d97706, #92400e);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
    box-shadow: 0 4px 12px rgba(217,119,6,0.25);
  }

  /* ============================================
     📊 PROGRESS BAR
     ============================================ */
  .progress-bar {
    position: fixed;
    top: var(--topbar-h);
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #fbbf24, #d97706);
    width: 0%;
    z-index: 999;
    transition: width 0.2s;
  }

  /* ============================================
     📐 LAYOUT
     ============================================ */
  .layout {
    display: flex;
    padding-top: var(--topbar-h);
    min-height: 100vh;
  }

  /* ============================================
     📚 SIDEBAR — مینیمال + فشرده
     ============================================ */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--card);
    border-left: 1px solid var(--border);
    position: fixed;
    top: var(--topbar-h);
    bottom: 0;
    right: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 8px;
    transition: width 0.3s ease;
    z-index: 998;
    display: flex;
    flex-direction: column;
  }

  .sidebar:hover {
    width: var(--sidebar-w-open);
    box-shadow: -10px 0 30px var(--shadow);
  }

  body.sidebar-locked .sidebar {
    width: var(--sidebar-w-open);
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb {
    background: var(--primary-light);
    border-radius: 3px;
  }

  /* ===== دکمه پین (وسط بالا) ===== */
  .sidebar-pin-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-pin {
    background: var(--primary-lighter);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-light);
    transition: all 0.2s;
  }
  .sidebar-pin:hover {
    background: var(--primary-light);
    color: var(--primary-dark);
    transform: scale(1.05);
  }
  .sidebar-pin .icon {
    width: 16px;
    height: 16px;
  }
  .sidebar-pin.pinned {
    background: var(--primary);
    color: white;
  }

  /* ===== آیتم‌های سایدبار ===== */
  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    font-size: 0.92rem;
    font-weight: 500;
    transition: all 0.2s;
    cursor: pointer;
    margin-bottom: 2px;
    white-space: nowrap;
    position: relative;
    min-height: 44px;
    justify-content: center;
  }

  .sidebar:hover .sidebar-link,
  body.sidebar-locked .sidebar-link {
    justify-content: flex-start;
    padding: 10px 14px;
  }

  .sidebar-link:hover {
    background: var(--primary-lighter);
    color: var(--primary-dark);
  }

  .sidebar-link.active {
    background: linear-gradient(135deg, #d97706, #b45309);
    color: white;
    box-shadow: 0 4px 15px rgba(217,119,6,0.25);
  }

  .sidebar-link .icon {
    width: 22px;
    height: 22px;
  }

  /* ===== متن و شمارنده — مخفی در حالت مینیمال ===== */
  .sidebar-link .text,
  .sidebar-link .count {
    opacity: 0;
    max-width: 0;
    overflow: hidden;
    transition: all 0.3s;
    white-space: nowrap;
  }

  .sidebar:hover .sidebar-link .text,
  .sidebar:hover .sidebar-link .count,
  body.sidebar-locked .sidebar-link .text,
  body.sidebar-locked .sidebar-link .count {
    opacity: 1;
    max-width: 200px;
  }

  .sidebar-link .count {
    margin-right: auto;
    font-size: 0.7rem;
    background: var(--primary-light);
    color: var(--primary-dark);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
  }

  .sidebar-link.active .count {
    background: rgba(255,255,255,0.25);
    color: white;
  }

  /* ===== Tooltip ===== */
  .sidebar:not(:hover) .sidebar-link::after {
    content: attr(data-tooltip);
    position: absolute;
    right: 100%;
    top: 50%;
    transform: translateY(-50%);
    background: var(--text);
    color: var(--card);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    margin-right: 8px;
    font-weight: 500;
    z-index: 100;
  }

  .sidebar:not(:hover) .sidebar-link:hover::after {
    opacity: 1;
  }

  /* ===== بخش‌بندی ===== */
  .sidebar-section {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sidebar-divider {
    height: 1px;
    background: var(--border);
    margin: 8px 8px;
  }

  /* ============================================
     📄 MAIN CONTENT
     ============================================ */
  .main {
    flex: 1;
    margin-right: var(--sidebar-w);
    padding: 30px 35px 60px;
    max-width: calc(100% - var(--sidebar-w));
    transition: margin 0.3s, max-width 0.3s;
  }

  body.sidebar-locked .main {
    margin-right: var(--sidebar-w-open);
    max-width: calc(100% - var(--sidebar-w-open));
  }

  /* ============================================
     🏠 HERO
     ============================================ */
  .hero {
    background: linear-gradient(135deg, #d97706, #92400e);
    color: white;
    border-radius: 20px;
    padding: 45px 40px;
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -80px; left: -80px;
    width: 250px; height: 250px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -100px; right: -50px;
    width: 300px; height: 300px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }

  .hero-content {
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 0.8rem;
    margin-bottom: 15px;
    font-weight: 600;
  }

  .hero h1 {
    font-size: 2.2rem;
    margin-bottom: 12px;
    font-weight: 900;
  }

  .hero p {
    font-size: 1.05rem;
    opacity: 0.95;
    max-width: 600px;
  }

  /* ============================================
     📊 STATS CARDS
     ============================================ */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
    margin-bottom: 30px;
  }

  .stat-card {
    background: var(--card);
    border-radius: 16px;
    padding: 22px;
    border: 2px solid var(--border);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .stat-card:hover {
    transform: translateY(-4px);
    border-color: var(--primary);
    box-shadow: 0 10px 25px var(--shadow);
  }

  .stat-icon {
    width: 50px; height: 50px;
    border-radius: 12px;
    background: var(--primary-light);
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .stat-icon .icon { width: 26px; height: 26px; }

  .stat-info .value {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--primary-dark);
    line-height: 1.2;
  }

  .stat-info .label {
    font-size: 0.85rem;
    color: var(--text-light);
    font-weight: 500;
  }

  /* ============================================
     📚 CHAPTER CARDS
     ============================================ */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .section-header h2 {
    font-size: 1.3rem;
    color: var(--text);
    font-weight: 800;
  }

  .chapters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .chapter-card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    border: 2px solid var(--border);
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chapter-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px var(--shadow-lg);
    border-color: var(--primary);
  }

  .chapter-num {
    width: 50px; height: 50px;
    background: linear-gradient(135deg, #d97706, #92400e);
    color: white;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 900;
    box-shadow: 0 6px 15px rgba(217,119,6,0.25);
  }

  .chapter-card h3 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--primary-dark);
  }

  .chapter-card p {
    font-size: 0.85rem;
    color: var(--text-light);
    margin: 0;
  }

  .chapter-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 15px;
    border-top: 1px dashed var(--border);
    font-size: 0.8rem;
    color: var(--text-light);
  }

  .chapter-progress-mini {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mini-bar {
    width: 60px;
    height: 5px;
    background: var(--primary-light);
    border-radius: 3px;
    overflow: hidden;
  }
  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #fbbf24, #d97706);
    border-radius: 3px;
  }

  /* ============================================
     📱 RESPONSIVE
     ============================================ */
  @media (max-width: 900px) {
    .menu-btn { display: flex; }
    .sidebar {
      transform: translateX(100%);
      width: var(--sidebar-w-open);
      box-shadow: -5px 0 30px rgba(0,0,0,0.2);
      padding: 12px 8px;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar .sidebar-link {
      justify-content: flex-start;
      padding: 10px 14px;
    }
    .sidebar .sidebar-link .text,
    .sidebar .sidebar-link .count {
      opacity: 1;
      max-width: 200px;
    }
    .main {
      margin-right: 0;
      max-width: 100%;
      padding: 20px 15px;
    }
    body.sidebar-locked .main {
      margin-right: 0;
      max-width: 100%;
    }
    .topbar-center { display: none; }
    .hero { padding: 30px 25px; }
    .hero h1 { font-size: 1.5rem; }
    .chapters-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 500px) {
    .topbar { padding: 0 12px; }
  }

  /* ============================================
     🌫️ OVERLAY
     ============================================ */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 997;
    backdrop-filter: blur(2px);
  }
  .overlay.active { display: block; }
</style>
</head>

  </symbol>
</svg>

<!-- ============================================
     🔝 TOP BAR
     ============================================ -->
<div class="topbar">
  <div class="topbar-right">
    <button class="menu-btn" onclick="toggleSidebar()">
      <svg class="icon"><use href="#icon-menu"></use></svg>
    </button>
    <a href="#home" class="logo-box">
      <svg class="logo-svg" viewBox="0 0 100 40">
        <use href="#icon-logo"></use>
      </svg>
    </a>
  </div>

  <div class="topbar-center">
    <div class="search-wrapper">
      <svg class="icon"><use href="#icon-search"></use></svg>
      <input type="text" class="search-input" placeholder="جستجو در درس‌ها، فرمول‌ها، تمرین‌ها...">
    </div>
  </div>

  <div class="topbar-left">
    <button class="icon-btn" title="علاقه‌مندی‌ها">
      <svg class="icon"><use href="#icon-star"></use></svg>
    </button>
    <button class="icon-btn" title="اعلان‌ها">
      <svg class="icon"><use href="#icon-bell"></use></svg>
      <span class="badge"></span>
    </button>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">
      <svg class="icon" id="themeIcon"><use href="#icon-moon"></use></svg>
    </button>
    <div class="user-avatar">ر</div>
  </div>
</div>

<!-- ============================================
     📊 PROGRESS BAR
     ============================================ -->
<div class="progress-bar" id="progressBar"></div>

<!-- ============================================
     🌫️ OVERLAY
     ============================================ -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- ============================================
     📐 LAYOUT
     ============================================ -->
<div class="layout">

  <aside class="sidebar" id="sidebar">
    
    <div class="sidebar-pin-wrap">
      <button class="sidebar-pin" id="pinBtn" onclick="togglePin()" title="قفل کردن سایدبار">
        <svg class="icon"><use href="#icon-pin"></use></svg>
      </button>
    </div>

    <div class="sidebar-section">
      <a href="#home" class="sidebar-link active" data-tooltip="خانه">
        <svg class="icon"><use href="#icon-home"></use></svg>
        <span class="text">خانه</span>
      </a>
      <a href="#lessons" class="sidebar-link" data-tooltip="درسنامه">
        <svg class="icon"><use href="#icon-book"></use></svg>
        <span class="text">درسنامه</span>
        <span class="count">۲۴</span>
      </a>
      <a href="#practice" class="sidebar-link" data-tooltip="تمرین‌ها">
        <svg class="icon"><use href="#icon-pencil"></use></svg>
        <span class="text">تمرین‌ها</span>
        <span class="count">۱۸۰</span>
      </a>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <a href="#exams" class="sidebar-link" data-tooltip="آزمون‌ها">
        <svg class="icon"><use href="#icon-target"></use></svg>
        <span class="text">آزمون‌ها</span>
      </a>
      <a href="#analysis" class="sidebar-link" data-tooltip="آنالیز و پیشرفت">
        <svg class="icon"><use href="#icon-chart"></use></svg>
        <span class="text">آنالیز و پیشرفت</span>
      </a>
      <a href="#formulas" class="sidebar-link" data-tooltip="فرمول‌نامه">
        <svg class="icon"><use href="#icon-file-text"></use></svg>
        <span class="text">فرمول‌نامه</span>
      </a>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <a href="#calculator" class="sidebar-link" data-tooltip="ماشین‌حساب">
        <svg class="icon"><use href="#icon-calculator"></use></svg>
        <span class="text">ماشین‌حساب</span>
      </a>
      <a href="#favorites" class="sidebar-link" data-tooltip="علاقه‌مندی‌ها">
        <svg class="icon"><use href="#icon-star"></use></svg>
        <span class="text">علاقه‌مندی‌ها</span>
      </a>
      <a href="#settings" class="sidebar-link" data-tooltip="تنظیمات">
        <svg class="icon"><use href="#icon-settings"></use></svg>
        <span class="text">تنظیمات</span>
      </a>
    </div>

  </aside>

  <main class="main" id="mainContent"></main>

</div>

<script>
/* ============================================
   📚 محتوای صفحه خانه
   ============================================ */
const HOME_CONTENT = `
  <div class="hero">
    <div class="hero-content">
      <div class="hero-badge">🎓 مسیر المپیاد فیزیک</div>
      <h1>سلام! خوش اومدی 👋</h1>
      <p>اینجا قراره ریاضی نهم رو عمیق یاد بگیری، سریع‌تر از مدرسه جلو بری و برای المپیاد فیزیک آماده بشی.</p>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon"><svg class="icon"><use href="#icon-book"></use></svg></div>
      <div class="stat-info">
        <div class="value">۸</div>
        <div class="label">فصل آموزشی</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><svg class="icon"><use href="#icon-pencil"></use></svg></div>
      <div class="stat-info">
        <div class="value">۱۸۰</div>
        <div class="label">تمرین</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><svg class="icon"><use href="#icon-target"></use></svg></div>
      <div class="stat-info">
        <div class="value">۲۴</div>
        <div class="label">آزمون</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><svg class="icon"><use href="#icon-flame"></use></svg></div>
      <div class="stat-info">
        <div class="value">۵</div>
        <div class="label">روز پیوسته</div>
      </div>
    </div>
  </div>

  <div class="section-header">
    <h2>📖 فصل‌های آموزشی</h2>
  </div>

  <div class="chapters-grid">
    ${[
      {n: '۱', t: 'مجموعه‌ها', c: 4, p: 100},
      {n: '۲', t: 'عددهای حقیقی', c: 3, p: 60},
      {n: '۳', t: 'استدلال و اثبات', c: 5, p: 20},
      {n: '۴', t: 'توان و ریشه', c: 4, p: 0},
      {n: '۵', t: 'عبارت‌های جبری', c: 3, p: 0},
      {n: '۶', t: 'خط و معادله‌ها', c: 3, p: 0},
      {n: '۷', t: 'عبارت‌های گویا', c: 3, p: 0},
      {n: '۸', t: 'حجم و مساحت', c: 3, p: 0}
    ].map(ch => `
      <a href="#ch${ch.n}" class="chapter-card">
        <div class="chapter-num">${ch.n}</div>
        <h3>فصل ${ch.n}: ${ch.t}</h3>
        <p>${ch.c} درس آموزشی</p>
        <div class="chapter-meta">
          <div class="chapter-progress-mini">
            <div class="mini-bar">
              <div class="mini-bar-fill" style="width:${ch.p}%"></div>
            </div>
            <span>${ch.p}٪</span>
          </div>
          <span>${ch.p === 0 ? '🆕' : ch.p === 100 ? '✅' : '📖'}</span>
        </div>
      </a>
    `).join('')}
  </div>
`;

/* ============================================
   🔄 ROUTER
   ============================================ */
function render() {
  const hash = location.hash.slice(1) || 'home';
  const main = document.getElementById('mainContent');

  if (hash === 'home' || hash === '') {
    main.innerHTML = HOME_CONTENT;
  } else {
    main.innerHTML = `
      <div class="hero">
        <div class="hero-content">
          <div class="hero-badge">🚧 در حال ساخت</div>
          <h1>به‌زودی...</h1>
          <p>این بخش هنوز آماده نشده. به‌زودی محتوای آن اضافه می‌شود.</p>
        </div>
      </div>
    `;
  }

  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  const activeLink = document.querySelector(`.sidebar-link[href="#${hash}"]`);
  if (activeLink) activeLink.classList.add('active');

  closeSidebar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================
   🌙 تم
   ============================================ */
function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeIcon').innerHTML = isDark 
    ? '<use href="#icon-sun"></use>' 
    : '<use href="#icon-moon"></use>';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  document.getElementById('themeIcon').innerHTML = '<use href="#icon-sun"></use>';
}

/* ============================================
   📌 پین
   ============================================ */
function togglePin() {
  document.body.classList.toggle('sidebar-locked');
  document.getElementById('pinBtn').classList.toggle('pinned');
  localStorage.setItem('sidebarLocked', document.body.classList.contains('sidebar-locked') ? 'true' : 'false');
}

if (localStorage.getItem('sidebarLocked') === 'true') {
  document.body.classList.add('sidebar-locked');
  document.getElementById('pinBtn').classList.add('pinned');
}

/* ============================================
   📱 سایدبار موبایل
   ============================================ */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('active');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}

/* ============================================
   📊 نوار پیشرفت
   ============================================ */
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progressBar').style.width = progress + '%';
});

/* ============================================
   🚀 راه‌اندازی
   ============================================ */
window.addEventListener('hashchange', render);
window.addEventListener('load', render);
</script>

</body>
</html>
