<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ریاضی نهم — درسنامه کامل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #e0e7ff;
    --accent: #ec4899;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8f0;
    --shadow: rgba(0,0,0,0.06);
    --sidebar-bg: #ffffff;
  }

  body.dark {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --text-light: #94a3b8;
    --border: #334155;
    --shadow: rgba(0,0,0,0.3);
    --primary-light: #312e81;
    --sidebar-bg: #1e293b;
  }

  body {
    font-family: 'Vazirmatn', 'Tahoma', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.9;
    font-size: 16px;
    transition: background 0.3s, color 0.3s;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    position: fixed;
    top: 0; right: 0; left: 0;
    height: 65px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(99,102,241,0.3);
  }
  .topbar-title {
    font-weight: 800;
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-title .logo {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }
  .topbar-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .icon-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    width: 40px; height: 40px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .icon-btn:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
  }
  .menu-toggle { display: none; }

  /* ===== SEARCH ===== */
  .search-box {
    position: relative;
    margin-left: 10px;
  }
  .search-box input {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    padding: 8px 15px;
    border-radius: 10px;
    width: 200px;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    transition: all 0.3s;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.7); }
  .search-box input:focus {
    background: rgba(255,255,255,0.25);
    width: 260px;
  }
  .search-results {
    position: absolute;
    top: 50px; right: 0;
    background: var(--card);
    color: var(--text);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    width: 320px;
    max-height: 400px;
    overflow-y: auto;
    display: none;
    z-index: 1001;
  }
  .search-results.active { display: block; }
  .search-results a {
    display: block;
    padding: 12px 16px;
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    transition: background 0.2s;
  }
  .search-results a:hover { background: var(--primary-light); }
  .search-results .empty {
    padding: 20px;
    text-align: center;
    color: var(--text-light);
  }

  /* ===== PROGRESS BAR ===== */
  .progress-bar {
    position: fixed;
    top: 65px; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #fbbf24, #ec4899);
    width: 0%;
    z-index: 999;
    transition: width 0.2s;
  }

  /* ===== LAYOUT ===== */
  .layout {
    display: flex;
    padding-top: 65px;
    min-height: 100vh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 280px;
    background: var(--sidebar-bg);
    border-left: 1px solid var(--border);
    padding: 20px 0;
    position: fixed;
    top: 65px;
    bottom: 0;
    right: 0;
    overflow-y: auto;
    transition: transform 0.3s;
    z-index: 998;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb {
    background: var(--primary-light);
    border-radius: 3px;
  }
  .sidebar-title {
    padding: 0 20px 15px;
    font-weight: 700;
    color: var(--primary-dark);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .chapter {
    margin-bottom: 5px;
  }
  .chapter-header {
    padding: 12px 20px;
    cursor: pointer;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
    color: var(--text);
    font-size: 0.95rem;
  }
  .chapter-header:hover { background: var(--primary-light); }
  .chapter-header .arrow {
    transition: transform 0.3s;
    font-size: 0.75rem;
    color: var(--text-light);
  }
  .chapter.open .chapter-header .arrow { transform: rotate(180deg); }
  .chapter-header.active {
    background: var(--primary);
    color: white;
  }
  .chapter-header.active .arrow { color: white; }
  .chapter-lessons {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s;
  }
  .chapter.open .chapter-lessons { max-height: 500px; }
  .chapter-lessons a {
    display: block;
    padding: 8px 20px 8px 35px;
    color: var(--text-light);
    text-decoration: none;
    font-size: 0.88rem;
    transition: all 0.2s;
    border-right: 3px solid transparent;
  }
  .chapter-lessons a:hover {
    background: var(--primary-light);
    color: var(--primary-dark);
    border-right-color: var(--primary);
  }
  .chapter-lessons a.active {
    color: var(--primary-dark);
    border-right-color: var(--primary);
    background: var(--primary-light);
    font-weight: 600;
  }

  /* ===== MAIN CONTENT ===== */
  .main {
    flex: 1;
    margin-right: 280px;
    padding: 30px 40px 60px;
    max-width: calc(100% - 280px);
  }

  .breadcrumb {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .breadcrumb a {
    color: var(--primary);
    text-decoration: none;
  }

  article {
    background: var(--card);
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 4px 20px var(--shadow);
  }

  article h1 {
    font-size: 2rem;
    color: var(--primary-dark);
    margin-bottom: 10px;
    font-weight: 800;
  }
  article h2 {
    font-size: 1.5rem;
    color: var(--primary-dark);
    margin: 40px 0 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
  }
  article h3 {
    font-size: 1.2rem;
    color: var(--text);
    margin: 25px 0 12px;
    padding-right: 12px;
    border-right: 4px solid var(--accent);
  }
  article h4 {
    font-size: 1.05rem;
    color: var(--primary-dark);
    margin: 20px 0 10px;
  }
  article p { margin-bottom: 12px; }
  article ul, article ol { padding-right: 25px; margin: 12px 0; }
  article li { margin-bottom: 8px; }

  /* ===== CONTENT BOXES ===== */
  .formula {
    background: linear-gradient(135deg, #eef2ff, #faf5ff);
    border: 2px solid var(--primary-light);
    border-radius: 12px;
    padding: 20px 25px;
    margin: 18px 0;
    text-align: center;
    font-size: 1.2rem;
    direction: ltr;
    font-family: 'Times New Roman', serif;
    color: var(--primary-dark);
    font-weight: 600;
    position: relative;
  }
  body.dark .formula {
    background: linear-gradient(135deg, #1e1b4b, #312e81);
  }
  .formula::before {
    content: '🔑';
    position: absolute;
    top: -12px; right: 15px;
    background: var(--card);
    padding: 0 6px;
    font-size: 1.1rem;
  }

  .definition {
    background: #f0fdf4;
    border-right: 5px solid var(--success);
    border-radius: 10px;
    padding: 18px 22px;
    margin: 18px 0;
  }
  body.dark .definition { background: #064e3b33; }
  .definition-title {
    font-weight: 700;
    color: var(--success);
    margin-bottom: 8px;
  }

  .warning {
    background: #fffbeb;
    border-right: 5px solid var(--warning);
    border-radius: 10px;
    padding: 18px 22px;
    margin: 18px 0;
  }
  body.dark .warning { background: #78350f33; }
  .warning-title {
    font-weight: 700;
    color: #b45309;
    margin-bottom: 8px;
  }

  .example {
    background: #fef2f2;
    border-right: 5px solid var(--danger);
    border-radius: 10px;
    padding: 18px 22px;
    margin: 18px 0;
  }
  body.dark .example { background: #7f1d1d33; }
  .example-title {
    font-weight: 700;
    color: var(--danger);
    margin-bottom: 12px;
  }
  .example-solution {
    background: var(--card);
    border-radius: 8px;
    padding: 15px;
    margin-top: 10px;
    font-size: 1.05rem;
    direction: ltr;
    text-align: center;
    font-family: 'Times New Roman', serif;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 18px 0;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 10px var(--shadow);
  }
  th {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 14px;
    text-align: right;
    font-weight: 600;
  }
  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  tr:nth-child(even) td { background: var(--primary-light); }
  body.dark tr:nth-child(even) td { background: #312e8133; }

  .yes { color: var(--success); font-weight: 700; }
  .no { color: var(--danger); font-weight: 700; }
  .math {
    direction: ltr;
    display: inline-block;
    font-family: 'Times New Roman', serif;
    font-size: 1.1em;
    font-weight: 600;
    color: var(--primary-dark);
  }
  body.dark .math { color: #a5b4fc; }

  /* ===== PAGINATION ===== */
  .pagination {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    gap: 15px;
  }
  .pagination a {
    flex: 1;
    background: var(--card);
    border: 2px solid var(--border);
    padding: 15px 20px;
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .pagination a:hover {
    border-color: var(--primary);
    transform: translateY(-3px);
    box-shadow: 0 10px 25px var(--shadow);
  }
  .pagination .label {
    font-size: 0.8rem;
    color: var(--text-light);
  }
  .pagination .title {
    font-weight: 700;
    color: var(--primary-dark);
  }
  .pagination .next { text-align: left; }

  /* ===== WELCOME PAGE ===== */
  .welcome {
    text-align: center;
    padding: 40px 20px;
  }
  .welcome .big-icon {
    font-size: 5rem;
    margin-bottom: 20px;
  }
  .welcome h1 {
    font-size: 2.5rem;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 15px;
  }
  .welcome p {
    color: var(--text-light);
    font-size: 1.1rem;
    max-width: 600px;
    margin: 0 auto 30px;
  }
  .chapter-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 30px;
    text-align: right;
  }
  .chapter-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 25px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .chapter-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 5px;
    height: 100%;
    background: linear-gradient(180deg, var(--primary), var(--accent));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .chapter-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px var(--shadow);
    border-color: var(--primary);
  }
  .chapter-card:hover::before { opacity: 1; }
  .chapter-card .num {
    font-size: 2rem;
    font-weight: 900;
    color: var(--primary-light);
    line-height: 1;
  }
  .chapter-card h3 {
    border: none;
    padding: 0;
    margin: 10px 0;
    color: var(--primary-dark);
  }
  .chapter-card p {
    color: var(--text-light);
    font-size: 0.9rem;
    margin: 0;
  }

  /* ===== FOOTER ===== */
  footer {
    text-align: center;
    padding: 30px;
    color: var(--text-light);
    font-size: 0.9rem;
    margin-right: 280px;
  }

  /* ===== OVERLAY (mobile) ===== */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 997;
  }
  .overlay.active { display: block; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .menu-toggle { display: flex; }
    .sidebar {
      transform: translateX(100%);
      width: 280px;
      box-shadow: -5px 0 30px rgba(0,0,0,0.2);
    }
    .sidebar.open { transform: translateX(0); }
    .main { margin-right: 0; max-width: 100%; padding: 20px; }
    footer { margin-right: 0; }
    article { padding: 25px; }
    article h1 { font-size: 1.5rem; }
    .search-box input { width: 130px; }
    .search-box input:focus { width: 180px; }
    .topbar-title span:not(.logo) { display: none; }
    .pagination { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="topbar">
  <div class="topbar-title">
    <button class="icon-btn menu-toggle" onclick="toggleSidebar()">☰</button>
    <div class="logo">📐</div>
    <span>ریاضی نهم</span>
  </div>
  <div class="topbar-actions">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="جستجو..." oninput="searchContent(this.value)">
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="حالت شب/روز">🌙</button>
  </div>
</div>

<!-- ===== PROGRESS BAR ===== -->
<div class="progress-bar" id="progressBar"></div>

<!-- ===== OVERLAY ===== -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- ===== LAYOUT ===== -->
<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">📚 فصل‌ها</div>
    <nav id="sidebarNav">
      <!-- این بخش توسط JS پر می‌شود -->
    </nav>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main" id="mainContent">
    <!-- محتوای صفحه توسط JS لود می‌شود -->
  </main>

</div>

<footer>
  <p>ساخته شده با ❤️ برای یادگیری بهتر ریاضی — پایه نهم</p>
</footer>

<script>
/* ============================================
   STRUCTURE — ساختار فصل‌ها و درس‌ها
   ============================================ */
const CHAPTERS = [
  {
    id: 'ch1',
    title: 'فصل ۱: مجموعه‌ها',
    lessons: [
      { id: 'ch1-l1', title: 'معرفی مجموعه' },
      { id: 'ch1-l2', title: 'مجموعه‌های برابر و نمایش' },
      { id: 'ch1-l3', title: 'اجتماع، اشتراک، تفاضل' },
      { id: 'ch1-l4', title: 'مجموعه‌ها و احتمال' }
    ]
  },
  {
    id: 'ch2',
    title: 'فصل ۲: عددهای حقیقی',
    lessons: [
      { id: 'ch2-l1', title: 'عددهای گویا' },
      { id: 'ch2-l2', title: 'عددهای حقیقی' },
      { id: 'ch2-l3', title: 'قدر مطلق و محاسبه تقریبی' }
    ]
  },
  {
    id: 'ch3',
    title: 'فصل ۳: استدلال و اثبات',
    lessons: [
      { id: 'ch3-l1', title: 'استدلال' },
      { id: 'ch3-l2', title: 'آشنایی با اثبات' },
      { id: 'ch3-l3', title: 'نیمساز و عمودمنصف' },
      { id: 'ch3-l4', title: 'حل مسئله در هندسه' },
      { id: 'ch3-l5', title: 'شکل‌های متشابه' }
    ]
  },
  {
    id: 'ch4',
    title: 'فصل ۴: توان و ریشه',
    lessons: [
      { id: 'ch4-l1', title: 'توان صحیح' },
      { id: 'ch4-l2', title: 'نماد علمی' },
      { id: 'ch4-l3', title: 'ریشه‌گیری' },
      { id: 'ch4-l4', title: 'جمع و تفریق رادیکال‌ها' }
    ]
  },
  {
    id: 'ch5',
    title: 'فصل ۵: عبارت‌های جبری',
    lessons: [
      { id: 'ch5-l1', title: 'اتحادها' },
      { id: 'ch5-l2', title: 'چند اتحاد دیگر و تجزیه' },
      { id: 'ch5-l3', title: 'ناابرابری‌ها و نامعادله' }
    ]
  },
  {
    id: 'ch6',
    title: 'فصل ۶: خط و معادله‌های خطی',
    lessons: [
      { id: 'ch6-l1', title: 'معادله خط' },
      { id: 'ch6-l2', title: 'شیب و عرض از مبدأ' },
      { id: 'ch6-l3', title: 'دستگاه معادله‌ها' }
    ]
  },
  {
    id: 'ch7',
    title: 'فصل ۷: عبارت‌های گویا',
    lessons: [
      { id: 'ch7-l1', title: 'معرفی و ساده کردن' },
      { id: 'ch7-l2', title: 'ضرب و تقسیم' },
      { id: 'ch7-l3', title: 'جمع و تفریق' }
    ]
  },
  {
    id: 'ch8',
    title: 'فصل ۸: حجم و مساحت',
    lessons: [
      { id: 'ch8-l1', title: 'حجم کره و نیم‌کره' },
      { id: 'ch8-l2', title: 'حجم هرم و مخروط' },
      { id: 'ch8-l3', title: 'مساحت و حجم مرکب' }
    ]
  }
];

/* ============================================
   CONTENT — محتوای درس‌ها
   نکته: محتوای هر درس رو اینجا اضافه کن
   ============================================ */
const CONTENT = {
  'welcome': `
    <div class="welcome">
      <div class="big-icon">📐</div>
      <h1>ریاضی پایه نهم</h1>
      <p>درسنامه کامل، از پایه تا پیشرفته — همراه با نکات المپیادی و مثال‌های حل‌شده</p>
      <div class="chapter-cards">
        ${CHAPTERS.map(ch => `
          <a href="#${ch.id}" class="chapter-card">
            <div class="num">${ch.id.replace('ch','')}</div>
            <h3>${ch.title.split(':')[1] || ch.title}</h3>
            <p>${ch.lessons.length} درس</p>
          </a>
        `).join('')}
      </div>
    </div>
  `,

  /* ============ فصل ۲ — درس ۱: عددهای گویا ============ */
  'ch2-l1': `
    <div class="breadcrumb">
      <a href="#welcome">خانه</a> ›
      <span>فصل ۲: عددهای حقیقی</span> ›
      <span>عددهای گویا</span>
    </div>

    <h1>📘 عددهای گویا</h1>

    <div class="definition">
      <div class="definition-title">📖 تعریف</div>
      <p>عدد گویا عددی است که بتوان آن را به صورت کسری از دو عدد صحیح نوشت:</p>
      <div class="formula">a / b &nbsp; (b ≠ 0)</div>
      <p>که در آن <span class="math">a</span> و <span class="math">b</span> عدد صحیح هستند و <span class="math">b</span> مخالف صفر است.</p>
    </div>

    <h3>نکات کلیدی</h3>
    <ul>
      <li>هر عدد صحیح، یک عدد گویاست؛ چون هر عدد صحیح مثل <span class="math">a</span> را می‌شود به صورت <span class="math">a/1</span> نوشت.</li>
      <li>مجموعه اعداد گویا را با <span class="math">ℚ</span> نمایش می‌دهیم.</li>
      <li>رابطه مجموعه‌ها: <span class="math">ℤ ⊂ ℚ</span> (صحیح‌ها زیرمجموعه گویاها هستند).</li>
    </ul>

    <h3>مثال‌ها</h3>
    <table>
      <tr><th>عدد</th><th>گویا؟</th><th>دلیل</th></tr>

    <div class="warning">

    <h3>نمایش اعشاری اعداد گویا</h3>

    <div class="formula">1/4 = 0/25 &nbsp;&nbsp; | &nbsp;&nbsp; 3/8 = 0/375</div>

    <h4>ب) اعشاری متناوب</h4>
    <p>رقم‌ها تکرار می‌شوند.</p>
    <div class="formula">1/3 = 0/333... = 0/3̅ &nbsp;&nbsp; | &nbsp;&nbsp; 7/6 = 1/1666... = 1/16̅</div>

    <div class="formula">
      🔑 قانون طلایی:<br>
      کسر (بعد از ساده شدن) اعشاری مختوم دارد <b>اگر و فقط اگر</b> مخرجش فقط شمارنده‌های اول ۲ و ۵ داشته باشد.
    </div>

    <h3>مثال</h3>
    <table>
      <tr><th>کسر</th><th>مخرج ساده‌شده</th><th>نتیجه</th></tr>
      <tr><td><span class="math">3/20</span></td><td><span class="math">2² × 5</span></td><td class="yes">✅ مختوم</td></tr>
      <tr><td><span class="math">5/6</span></td><td><span class="math">2 × 3</span></td><td class="no">❌ متناوب</td></tr>
      <tr><td><span class="math">7/16</span></td><td><span class="math">2⁴</span></td><td class="yes">✅ مختوم</td></tr>
      <tr><td><span class="math">5/11</span></td><td><span class="math">11</span></td><td class="no">❌ متناوب</td></tr>

    <h3>تبدیل اعشاری متناوب به کسر</h3>

        10x = 3/333... <br>
        10x − x = 3/333... − 0/333... <br>
        9x = 3 <br>

    <div class="example">
      <div class="example-title">📌 مثال: تبدیل <span class="math">0/12̅</span> به کسر</div>

        x = 0/121212... <br>
        100x = 12/121212... <br>
        100x − x = 12 <br>
        99x = 12 <br>
        x = 12/99 = 4/33
      </div>
    </div>
  `,

/* ============================================
   SIDEBAR
   ============================================ */
function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const currentHash = location.hash || '#welcome';

  nav.innerHTML = CHAPTERS.map(ch => {
    const isActive = currentHash.startsWith('#' + ch.id);
    return `
      <div class="chapter ${isActive ? 'open' : ''}">
        <div class="chapter-header ${isActive ? 'active' : ''}" onclick="toggleChapter('${ch.id}')">
          <span>${ch.title}</span>
          <span class="arrow">▼</span>
        </div>
        <div class="chapter-lessons">
          ${ch.lessons.map(l => `
            <a href="#${l.id}" class="${currentHash === '#' + l.id ? 'active' : ''}">${l.title}</a>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function toggleChapter(id) {
  const chapters = document.querySelectorAll('.chapter');
  chapters.forEach(ch => {
    const header = ch.querySelector('.chapter-header');
    if (header.textContent.includes(CHAPTERS.find(c => c.id === id).title)) {
      ch.classList.toggle('open');
    }
  });
}

/* ============================================
   ROUTER
   ============================================ */
function render() {
  const hash = location.hash.slice(1) || 'welcome';
  const main = document.getElementById('mainContent');
  const content = CONTENT[hash];

  if (content) {
    main.innerHTML = `<article>${content}</article>`;
  } else {
    // اگه محتوا نبود، یه صفحه در حال ساخت نشون بده
    main.innerHTML = `
      <article>
        <div class="welcome">
          <div class="big-icon">🚧</div>
          <h1>در حال ساخت</h1>
          <p>محتوای این درس به‌زودی اضافه می‌شود.</p>
          <a href="#welcome" style="display:inline-block;margin-top:20px;padding:12px 25px;background:var(--primary);color:white;border-radius:10px;text-decoration:none;font-weight:600;">بازگشت به خانه</a>
        </div>
      </article>
    `;
  }

  renderSidebar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  closeSidebar();
}

window.addEventListener('hashchange', render);
window.addEventListener('load', render);

/* ============================================
   THEME TOGGLE
   ============================================ */
function toggleTheme() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

// لود تم ذخیره‌شده
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  document.getElementById('themeBtn').textContent = '☀️';
}

/* ============================================
   SIDEBAR MOBILE
   ============================================ */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('active');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}

/* ============================================
   SEARCH
   ============================================ */
function searchContent(query) {
  const results = document.getElementById('searchResults');
  if (!query.trim()) {
    results.classList.remove('active');
    return;
  }

  const q = query.trim();
  const matches = [];

  // جستجو در فصل‌ها و درس‌ها
  CHAPTERS.forEach(ch => {
    if (ch.title.includes(q)) {
      matches.push({ title: ch.title, id: ch.id, type: 'فصل' });
    }
    ch.lessons.forEach(l => {
      if (l.title.includes(q)) {
        matches.push({ title: l.title, id: l.id, type: ch.title });
      }
    });
  });

  // جستجو در محتوا
  Object.keys(CONTENT).forEach(key => {
    if (key === 'welcome') return;
    const text = CONTENT[key].replace(/<[^>]*>/g, '');
    if (text.includes(q)) {
      const found = findLessonById(key);
      if (found && !matches.find(m => m.id === key)) {
        matches.push({ title: found.lesson.title, id: key, type: found.chapter.title });
      }
    }
  });

  if (matches.length === 0) {
    results.innerHTML = '<div class="empty">نتیجه‌ای پیدا نشد 🔍</div>';
  } else {
    results.innerHTML = matches.slice(0, 8).map(m => `
      <a href="#${m.id}" onclick="document.getElementById('searchResults').classList.remove('active');document.getElementById('searchInput').value='';">
        <div style="font-size:0.75rem;color:var(--text-light);">${m.type}</div>
        <div>${m.title}</div>
      </a>
    `).join('');
  }
  results.classList.add('active');
}

function findLessonById(id) {
  for (const ch of CHAPTERS) {
    const lesson = ch.lessons.find(l => l.id === id);
    if (lesson) return { chapter: ch, lesson };
  }
  return null;
}

// بستن نتایج جستجو با کلیک بیرون
document.addEventListener('click', (e) => {
  const searchBox = document.querySelector('.search-box');
  if (!searchBox.contains(e.target)) {
    document.getElementById('searchResults').classList.remove('active');
  }
});

/* ============================================
   PROGRESS BAR
   ============================================ */
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progressBar').style.width = progress + '%';
});

/* ============================================
   KEYBOARD SHORTCUTS
   ============================================ */
document.addEventListener('keydown', (e) => {
  // Ctrl+K یا / برای جستجو
  if ((e.ctrlKey && e.key === 'k') || (e.key === '/' && !e.target.matches('input'))) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  // Esc برای بستن
  if (e.key === 'Escape') {
    document.getElementById('searchResults').classList.remove('active');
    closeSidebar();
  }
});
</script>

</html>
